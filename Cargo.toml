[package]
name = "grokbot-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Rust MCP server for managing every aspect of a GrokBot (xAI Grok) from other AI clients"
keywords = ["mcp", "model-context-protocol", "grok", "xai", "ai"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "grokbot-control"
path = "src/main.rs"

[lib]
name = "grokbot_control"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-stream = "0.1"
fs2 = "0.4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
